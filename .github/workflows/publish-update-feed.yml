# 发布仓库（bg-pos-aio-release）专用：把最新正式版 latest.yml 发布到 GitHub Pages 作为更新清单。
# - release published/edited 触发；每小时 cron 自愈（手动发版或清单异常时自动收敛）
# - files[].url 改写为 GitHub 绝对地址：清单走 Pages 分发，安装包直连 GitHub tag 路径
#   （不占 Pages 带宽，sha512 端到端校验由客户端执行）
# - 自定义域名（可选）：仓库 Variables 配置 UPDATE_FEED_CNAME 后自动写入 CNAME 文件
name: Publish update feed

on:
  release:
    types: [published, edited]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析最新正式版并生成改写后的 latest.yml
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')"
          echo "最新正式版 tag: ${TAG}"
          curl -fsSL --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.yml" \
            -o latest.yml
          # 相对文件地址改写为绝对地址，electron-updater 按绝对地址直连 GitHub 下载
          jq --arg base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            '.files |= map(.url = $base + "/" + .url)' \
            latest.yml > latest.yml.tmp
          mv latest.yml.tmp latest.yml
          if [ -n "${{ vars.UPDATE_FEED_CNAME || '' }}" ]; then
            printf '%s' "${{ vars.UPDATE_FEED_CNAME }}" > CNAME
          fi
          head -n 8 latest.yml

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
